name: snap
on:
  push:
    branches:
      - debugging-tutorial
  pull_request:
    branches:
      - debugging-tutorial
  workflow_dispatch:
  workflow_call:
   inputs:
      branch-name:
        required: false
        type: string
        default: ''

jobs:
  snap:
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    with:
      runs-on: '["ubuntu-latest", ["self-hosted", "linux", "ARM64", "large", "noble"]]'
      lxd-image: "ubuntu:20.04"
      snapcraft-source-subdir: "."
      git-ref: ${{ inputs.branch-name == '' && github.ref || inputs.branch-name }}
